name: Collect benchmark result

on:
  repository_dispatch:
    types: [benchmark-complete]
  workflow_dispatch:
    inputs:
      benchmark_repository:
        description: Benchmark runner OWNER/REPO
        required: true
        default: soulomoon/haskell-language-server
        type: string
      run_id:
        description: Completed benchmark workflow run ID
        required: true
        type: string
      run_attempt:
        description: Workflow run attempt
        required: true
        default: '1'
        type: string
      upstream_commit:
        description: Expected full upstream commit SHA
        required: true
        type: string
      expected_artifacts:
        description: Expected benchmark matrix artifact count
        required: true
        default: '4'
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: collect-benchmark-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      ALLOWED_BENCHMARK_REPOSITORY: ${{ vars.BENCHMARK_REPOSITORY || 'soulomoon/haskell-language-server' }}
      BENCHMARK_REPOSITORY: ${{ github.event.client_payload.benchmark_repository || inputs.benchmark_repository }}
      RUN_ID: ${{ github.event.client_payload.run_id || inputs.run_id }}
      RUN_ATTEMPT: ${{ github.event.client_payload.run_attempt || inputs.run_attempt }}
      UPSTREAM_REPOSITORY: ${{ github.event.client_payload.upstream_repository || 'haskell/haskell-language-server' }}
      UPSTREAM_COMMIT: ${{ github.event.client_payload.upstream_commit || inputs.upstream_commit }}
      EXPECTED_ARTIFACTS: ${{ github.event.client_payload.expected_artifacts || inputs.expected_artifacts }}
      ALLOWED_EXPECTED_ARTIFACTS: ${{ vars.EXPECTED_ARTIFACTS || '4' }}
      BENCHMARK_GH_TOKEN: ${{ secrets.BENCHMARK_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate dispatch source
        run: |
          test "$BENCHMARK_REPOSITORY" = "$ALLOWED_BENCHMARK_REPOSITORY" || {
            echo "Refusing benchmark repository $BENCHMARK_REPOSITORY" >&2
            exit 1
          }
          test "$UPSTREAM_REPOSITORY" = 'haskell/haskell-language-server' || {
            echo "Refusing upstream repository $UPSTREAM_REPOSITORY" >&2
            exit 1
          }
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'run_id must be a positive integer' >&2
            exit 1
          }
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
            echo 'run_attempt must be a positive integer' >&2
            exit 1
          }
          [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'upstream_commit must be a full lowercase SHA' >&2
            exit 1
          }
          [[ "$EXPECTED_ARTIFACTS" =~ ^[1-9][0-9]*$ ]] || {
            echo 'expected_artifacts must be a positive integer' >&2
            exit 1
          }
          test "$EXPECTED_ARTIFACTS" = "$ALLOWED_EXPECTED_ARTIFACTS" || {
            echo "Expected artifact count must be $ALLOWED_EXPECTED_ARTIFACTS" >&2
            exit 1
          }
          test -n "$BENCHMARK_GH_TOKEN" || {
            echo 'BENCHMARK_TOKEN is required' >&2
            exit 1
          }

      - name: Verify completed benchmark run
        env:
          GH_TOKEN: ${{ env.BENCHMARK_GH_TOKEN }}
        run: |
          expected_workflow_id=$(gh api \
            "repos/$BENCHMARK_REPOSITORY/actions/workflows/upstream-benchmark-observer.yml" \
            --jq .id)
          run=$(gh run view "$RUN_ID" \
            --repo "$BENCHMARK_REPOSITORY" \
            --json attempt,conclusion,event,workflowDatabaseId)
          jq -e \
            --argjson attempt "$RUN_ATTEMPT" \
            --argjson workflow_id "$expected_workflow_id" \
            '.attempt == $attempt
              and .conclusion == "success"
              and .event == "workflow_dispatch"
              and .workflowDatabaseId == $workflow_id' \
            <<< "$run" >/dev/null || {
            echo "Run $RUN_ID is not a successful expected benchmark workflow attempt" >&2
            exit 1
          }

      - name: Download normalized benchmark artifacts
        env:
          GH_TOKEN: ${{ env.BENCHMARK_GH_TOKEN }}
        run: >-
          gh run download "$RUN_ID"
          --repo "$BENCHMARK_REPOSITORY"
          --pattern 'observer-benchmark-*'
          --dir incoming

      - name: Validate and append history
        run: |
          python3 scripts/collect.py \
            --input incoming \
            --history-json data/history.json \
            --history-csv data/history.csv \
            --expected-repository "$BENCHMARK_REPOSITORY" \
            --expected-run-id "$RUN_ID" \
            --expected-run-attempt "$RUN_ATTEMPT" \
            --expected-upstream-repository "$UPSTREAM_REPOSITORY" \
            --expected-upstream-commit "$UPSTREAM_COMMIT" \
            --expected-artifacts "$EXPECTED_ARTIFACTS"

      - name: Commit durable history
        id: commit
        env:
          UPSTREAM_REF: ${{ github.event.client_payload.upstream_ref || 'manual' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history.json data/history.csv
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m "Record HLS benchmark $UPSTREAM_COMMIT"
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy updated dashboard
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
